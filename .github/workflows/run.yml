name: Sales Collector Bot

on:
  schedule:
    # 매시간 30분마다 자동 실행 (UTC 기준 매시간 30분)
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  run-collector:
    runs-on: ubuntu-latest

    steps:
    - name: 코드 불러오기
      uses: actions/checkout@v3

    - name: 파이썬 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 패키지 설치
      run: |
        pip install -r requirements.txt
        playwright install chromium

    - name: 수집 프로그램 실행
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        EASYPOS_ID: ${{ secrets.EASYPOS_ID }}
        EASYPOS_PW: ${{ secrets.EASYPOS_PW }}
        BEAVER_ID: ${{ secrets.BEAVER_ID }}
        BEAVER_PW: ${{ secrets.BEAVER_PW }}
        CPLAT_BRAND_CODE: ${{ secrets.CPLAT_BRAND_CODE }}
        CPLAT_ID: ${{ secrets.CPLAT_ID }}
        CPLAT_PW: ${{ secrets.CPLAT_PW }}
      run: python main.py
